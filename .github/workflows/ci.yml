name: exchange-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exchange -d exchange"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://exchange:exchange@localhost:5432/exchange
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      CORS_ORIGIN: http://localhost:3000
      WITHDRAWAL_WEBHOOK_SECRET: ci-only-withdrawal-webhook-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @exchange/db db:generate

      - name: Apply database schema
        run: pnpm --filter @exchange/db db:deploy

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: API tests
        run: pnpm --filter @exchange/api test

      - name: Engine tests
        run: pnpm --filter @exchange/engine test

      - name: Worker tests
        run: pnpm --filter @exchange/worker test
