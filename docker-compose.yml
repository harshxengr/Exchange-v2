services:
  postgres:
    image: postgres:17
    container_name: exchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
      POSTGRES_DB: exchange
    ports:
      - "5432:5432"
    volumes:
      - exchange_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U exchange -d exchange" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: exchange-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - exchange_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  exchange_postgres_data:
  exchange_redis_data:
