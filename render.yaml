services:
  - type: web
    name: exchange-v2-demo
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build:backend
    startCommand: pnpm db:deploy && pnpm start:demo
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRES_IN
        value: 1h

      - key: CORS_ORIGIN
        sync: false

      - key: WITHDRAWAL_WEBHOOK_SECRET
        sync: false

      - key: PAYOUT_PROVIDER
        value: demo

      - key: DEMO_PAYOUT_MODE
        value: COMPLETE

      - key: DEMO_PAYOUT_DELAY_MS
        value: "3000"

      - key: ALLOW_DEMO_PAYOUTS_IN_PRODUCTION
        value: "true"

      - key: PAYOUT_POLL_MS
        value: "2000"

      - key: PAYOUT_BASE_RETRY_MS
        value: "5000"

      - key: PAYOUT_RECONCILE_MS
        value: "10000"

      - key: PAYOUT_RECONCILE_COMPLETED_MS
        value: "30000"

      - key: PAYOUT_MAX_ATTEMPTS
        value: "10"
